name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-web:
    name: Build apps/web (static export check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The Prisma CLI only reads .env, not Next.js' .env.local.
      - name: Prepare environment
        working-directory: apps/web
        run: |
          echo "DATABASE_URL=file:./dev.db" >> .env
          echo "NEXT_BASE_PATH=/${{ github.event.repository.name }}" >> .env.local
          echo "NEXT_ASSET_PREFIX=/${{ github.event.repository.name }}" >> .env.local

      - name: Setup Prisma
        working-directory: apps/web
        env:
          DATABASE_URL: file:./dev.db
        run: |
          npx prisma db push
          npx ts-node --compiler-options '{"module":"CommonJS"}' prisma/seed.ts

      - name: Build
        working-directory: apps/web
        env:
          DATABASE_URL: file:./dev.db
        run: npm run build

  build-yahua:
    name: Build apps/yahua-static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build site with base path
        working-directory: apps/yahua-static
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      # public/ is generated, so the availability JSON must be refreshed on every
      # deploy. A flaky iCal fetch must not block publishing the site.
      - name: Sync availability calendars
        working-directory: apps/yahua-static
        continue-on-error: true
        run: npm run sync-calendars

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: apps/yahua-static/public

  deploy:
    needs: [ build-web, build-yahua ]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
